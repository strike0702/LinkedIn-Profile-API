name: Keep Render Alive

on:
  schedule:
    # Every 12 minutes (UTC). GitHub may delay slightly under load.
    - cron: "*/12 * * * *"
  workflow_dispatch: # manual trigger for testing

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Health check
        run: |
          set -euo pipefail
          URL="https://linkedin-profile-api-bsa2.onrender.com/health"
          echo "GET $URL"
          curl -fsS --retry 3 --retry-delay 5 --max-time 60 "$URL"
          echo
